<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BSR1017 / BSR1018 — Curriculum Map · ISMMS MSTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{
  --bg:#050A12; --bg2:#0A1522;
  --navy:#005EB8; --navy-deep:#00417F; --cyan:#00AEEF; --accent:#62D9FF; --magenta:#62D9FF;
  --ink:#F4F8FC; --muted:#AAB9C8; --faint:#78899C;
  --paper:#050A12; --paper2:rgba(98,217,255,.055); --card:rgba(13,27,44,.62);
  --line:rgba(98,217,255,.18); --line2:rgba(98,217,255,.32);
  --navy-tint:rgba(0,94,184,.18); --cyan-tint:rgba(0,174,239,.14); --magenta-tint:rgba(98,217,255,.12);
  --shadow:0 10px 34px rgba(0,16,38,.45);
  --shadow-lg:inset 0 1px 0 rgba(255,255,255,.08),0 20px 70px rgba(0,94,184,.20),0 0 80px rgba(0,174,239,.08);
  --radius:20px;
  --disp:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter","Manrope",system-ui,sans-serif;
  --body:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter","Manrope",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Public Sans',system-ui,sans-serif;
  background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
#root{min-height:100vh}
.serif{font-family:var(--disp)}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---------- Layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(5,10,18,.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--navy),var(--navy-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px;flex-shrink:0}
.brand-mark::after{content:"";position:absolute}
.brand-txt b{font-family:var(--disp);font-weight:600;font-size:17px;display:block;line-height:1.1;letter-spacing:-.01em}
.brand-txt span{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);background:none;border:none;padding:9px 13px;border-radius:9px;cursor:pointer;transition:all .16s;white-space:nowrap}
.nav button:hover{color:var(--navy);background:var(--navy-tint)}
.nav button.active{color:#fff;background:var(--navy)}
.menu-btn{display:none;margin-left:auto;background:var(--navy);color:#fff;border:none;border-radius:9px;width:42px;height:38px;font-size:18px;cursor:pointer}

@media(max-width:920px){
  .nav{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--paper);border-bottom:1px solid var(--line);padding:10px;gap:4px}
  .nav.open{display:flex}
  .nav button{text-align:left;padding:12px 14px}
  .menu-btn{display:block}
}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding:78px 0 70px}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 380px at 88% -8%,rgba(6,171,235,.30),transparent 60%),
  radial-gradient(700px 360px at 6% 118%,rgba(220,41,141,.22),transparent 60%);
  pointer-events:none}
.hero-grid-bg{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.hero-inner{position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:22px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--cyan)}
.hero h1{font-family:var(--disp);font-weight:600;font-size:clamp(34px,5.4vw,62px);line-height:1.02;letter-spacing:-.02em;max-width:16ch}
.hero h1 em{font-style:italic;color:var(--cyan)}
.hero p.lede{margin-top:22px;font-size:clamp(16px,1.7vw,19px);line-height:1.6;color:rgba(255,255,255,.82);max-width:62ch}
.hero-stats{display:flex;flex-wrap:wrap;gap:36px;margin-top:42px}
.hstat .n{font-family:var(--disp);font-weight:600;font-size:38px;line-height:1;letter-spacing:-.02em}
.hstat .l{font-size:12.5px;color:rgba(255,255,255,.62);margin-top:7px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.hstat .n .small{font-size:18px;color:rgba(255,255,255,.6)}

/* ---------- Sections ---------- */
.section{padding:60px 0}
.section.tight{padding:42px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.sec-head h2{font-family:var(--disp);font-weight:600;font-size:clamp(24px,3vw,33px);letter-spacing:-.018em;line-height:1.1}
.sec-head .kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta);margin-bottom:9px;display:block}
.sec-head p{color:var(--muted);max-width:60ch;margin-top:10px;font-size:15px}

/* ---------- Course cards (overview) ---------- */
.course-cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:760px){.course-cards{grid-template-columns:1fr}}
.ccard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow);overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:pointer}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.ccard .stripe{position:absolute;top:0;left:0;right:0;height:5px}
.ccard.fall .stripe{background:linear-gradient(90deg,var(--navy),var(--cyan))}
.ccard.spring .stripe{background:linear-gradient(90deg,var(--magenta),var(--cyan))}
.ccard .code{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--navy);letter-spacing:.02em}
.ccard.spring .code{color:var(--magenta)}
.ccard h3{font-family:var(--disp);font-weight:600;font-size:25px;margin:6px 0 4px;letter-spacing:-.01em}
.ccard .term{font-size:13.5px;color:var(--faint);font-weight:600}
.ccard .desc{color:var(--muted);font-size:14.5px;margin:16px 0 20px;line-height:1.6}
.ccard .mini-stats{display:flex;gap:22px;border-top:1px solid var(--line);padding-top:18px}
.ccard .mini-stats .n{font-family:var(--disp);font-weight:600;font-size:23px;line-height:1}
.ccard .mini-stats .l{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:4px}
.ccard .go{margin-top:20px;font-size:13px;font-weight:700;color:var(--navy);display:inline-flex;align-items:center;gap:7px}
.ccard.spring .go{color:var(--magenta)}

/* ---------- Hierarchy concept ---------- */
.hier-concept{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
@media(max-width:760px){.hier-concept{grid-template-columns:1fr}}
.hlevel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;position:relative;box-shadow:var(--shadow)}
.hlevel .tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;margin-bottom:13px}
.hlevel.l1 .tag{background:var(--navy);color:#fff}
.hlevel.l2 .tag{background:var(--cyan);color:#06324a}
.hlevel.l3 .tag{background:var(--magenta-tint);color:var(--magenta)}
.hlevel h4{font-family:var(--disp);font-weight:600;font-size:18px;margin-bottom:6px}
.hlevel p{font-size:13.5px;color:var(--muted);line-height:1.55}
.hlevel .big{font-family:var(--disp);font-weight:600;font-size:30px;color:var(--navy);position:absolute;top:20px;right:24px}

/* ---------- Filter bar ---------- */
.toolbar{position:sticky;top:64px;z-index:30;background:rgba(250,249,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 0}
.toolbar-inner{display:flex;flex-direction:column;gap:14px}
.searchrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;font-family:inherit;font-size:14.5px;padding:11px 14px 11px 40px;border:1px solid var(--line2);border-radius:11px;background:var(--card);color:var(--ink);transition:border .15s,box-shadow .15s}
.search input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-tint)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.count-pill{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;background:var(--paper2);padding:8px 14px;border-radius:10px}
.count-pill b{color:var(--navy);font-family:'IBM Plex Mono',monospace}
.filtergroups{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.fgroup{display:flex;flex-direction:column;gap:7px}
.fgroup .flabel{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;transition:all .14s;white-space:nowrap}
.chip:hover{border-color:var(--navy);color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on.cyan{background:var(--cyan);border-color:var(--cyan);color:#06324a}
.chip.on.magenta{background:var(--magenta);border-color:var(--magenta);color:#fff}
.clearbtn{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--magenta);background:none;border:none;cursor:pointer;padding:6px 4px;align-self:flex-end}
.clearbtn:hover{text-decoration:underline}

/* ---------- Session grid ---------- */
.modgroup{margin-top:34px}
.modgroup:first-child{margin-top:8px}
.mod-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.mod-badge{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;color:#fff;letter-spacing:.03em}
.mod-head h3{font-family:var(--disp);font-weight:600;font-size:21px;letter-spacing:-.01em}
.mod-head .msub{font-size:13px;color:var(--faint);font-weight:600}
.mod-line{flex:1;height:1px;background:var(--line);min-width:30px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px 18px;cursor:pointer;transition:all .16s;position:relative;border-left-width:4px}
.scard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line2)}
.scard .scode{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--faint)}
.scard .stype{float:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px}
.scard h4{font-family:'Public Sans';font-weight:700;font-size:15px;margin:9px 0 8px;line-height:1.3;letter-spacing:-.005em}
.scard .slec{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.scard .stags{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px}
.ctag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--navy-tint);color:var(--navy)}
.atag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--cyan-tint);color:#0676a0}
.scard .sdate{font-size:11.5px;color:var(--faint);font-weight:600;margin-top:11px;font-family:'IBM Plex Mono',monospace}

/* session type accents */
.t-Lecture{border-left-color:var(--navy)} .stype.t-Lecture{background:var(--navy-tint);color:var(--navy)}
.t-TechStudio{border-left-color:var(--cyan)} .stype.t-TechStudio{background:var(--cyan-tint);color:#0676a0}
.t-JCPS{border-left-color:var(--accent)} .stype.t-JCPS{background:var(--magenta-tint);color:var(--magenta)}
.t-Review{border-left-color:var(--faint)} .stype.t-Review{background:var(--paper2);color:var(--muted)}
.t-Exam{border-left-color:var(--navy-deep)} .stype.t-Exam{background:#e7e7f0;color:var(--navy-deep)}

/* ---------- status badges (BSR1018) ---------- */
.statusb{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:20px}
.statusb::before{content:"";width:6px;height:6px;border-radius:50%}
.st-confirmed{background:#e4f6ec;color:#1b7a44}.st-confirmed::before{background:#1b9a55}
.st-baseline{background:var(--cyan-tint);color:#0676a0}.st-baseline::before{background:var(--cyan)}
.st-proposed{background:#fff3e0;color:#9a6212}.st-proposed::before{background:#e0961e}
.st-dev{background:var(--paper2);color:var(--muted)}.st-dev::before{background:var(--faint)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,22,45,.42);backdrop-filter:blur(3px);z-index:100;display:flex;justify-content:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(560px,100%);height:100%;background:var(--paper);overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2);animation:slidein .26s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:.6}to{transform:translateX(0);opacity:1}}
.modal-top{position:sticky;top:0;background:var(--navy);color:#fff;padding:24px 28px 22px;z-index:2}
.modal.spring .modal-top{background:linear-gradient(120deg,var(--navy),#5a1a5e)}
.modal-top .close{position:absolute;top:18px;right:20px;width:32px;height:32px;border-radius:8px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer;transition:background .15s}
.modal-top .close:hover{background:rgba(255,255,255,.28)}
.modal-top .mcode{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cyan);font-weight:600;letter-spacing:.03em}
.modal-top h3{font-family:var(--disp);font-weight:600;font-size:24px;margin:8px 0 12px;line-height:1.15;padding-right:30px}
.modal-top .mmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mmeta .pill{font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px}
.modal-body{padding:26px 28px 50px}
.mblock{margin-bottom:26px}
.mblock .h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.mblock .h::after{content:"";flex:1;height:1px;background:var(--line)}
.obj-list{display:flex;flex-direction:column;gap:11px}
.obj-item{display:flex;gap:11px;font-size:14px;line-height:1.5;color:var(--ink)}
.obj-item .num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--navy-tint);color:var(--navy);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;font-family:'IBM Plex Mono',monospace}
.maplink{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px}
.maplink .lt{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--magenta);margin-bottom:5px}
.maplink .lx{font-size:13.5px;line-height:1.5;color:var(--ink)}
.tagrow{display:flex;gap:7px;flex-wrap:wrap}
.tagbig{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tagbig.c{background:var(--navy-tint)}
.tagbig.a{background:var(--cyan-tint)}
.tagbig .tk{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--navy)}
.tagbig.a .tk{color:#0676a0}
.tagbig .tn{font-size:11.5px;color:var(--muted);font-weight:500}
.note-box{background:var(--magenta-tint);border-radius:11px;padding:13px 15px;font-size:13.5px;color:#8a1c5b;line-height:1.5}

/* ---------- Timeline ---------- */
.tl{position:relative;margin-top:10px}
.tl-week{display:flex;gap:18px;margin-bottom:6px}
.tl-wlabel{flex-shrink:0;width:92px;text-align:right;padding-top:10px}
.tl-wlabel .wk{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.tl-wlabel .wd{font-size:12.5px;font-weight:600;color:var(--navy);font-family:var(--disp)}
.tl-track{flex:1;border-left:2px solid var(--line);padding:6px 0 18px 20px;position:relative}
.tl-track::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--navy);border:2px solid var(--paper)}
.tl-sessions{display:flex;flex-direction:column;gap:8px}
.tl-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;transition:all .15s;border-left-width:4px}
.tl-row:hover{transform:translateX(3px);box-shadow:var(--shadow)}
.tl-row .tlcode{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--faint);width:54px;flex-shrink:0}
.tl-row .tltitle{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.tl-row .tllec{font-size:12px;color:var(--muted);flex-shrink:0}
.tl-row .tldot{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:20px;flex-shrink:0}
@media(max-width:680px){.tl-wlabel{width:64px}.tl-row .tllec{display:none}}

/* ---------- Hierarchy tree ---------- */
.clo-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.clo-head{display:flex;align-items:flex-start;gap:16px;padding:20px 22px;cursor:pointer;transition:background .15s}
.clo-head:hover{background:var(--navy-tint)}
.clo-num{flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;background:var(--navy);color:#fff;padding:8px 12px;border-radius:9px}
.clo-main{flex:1}
.clo-main .dom{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--magenta);margin-bottom:4px}
.clo-main .txt{font-size:15px;line-height:1.5;color:var(--ink);font-weight:500}
.clo-main .ctags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.clo-toggle{flex-shrink:0;color:var(--faint);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;padding-top:4px}
.clo-toggle .arr{transition:transform .2s;display:inline-block}
.clo-block.open .clo-toggle .arr{transform:rotate(90deg)}
.mlo-zone{padding:0 22px 18px 22px;display:none}
.clo-block.open .mlo-zone{display:block}
.mlo-card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:15px 17px;margin-top:10px}
.mlo-card .mh{display:flex;gap:11px;align-items:flex-start}
.mlo-card .mtag{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#0676a0;background:var(--cyan-tint);padding:4px 9px;border-radius:7px;flex-shrink:0}
.mlo-card .mtxt{font-size:13.5px;line-height:1.5;color:var(--ink)}
.mlo-card .mses{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.mlo-card .mses .sl{font-size:10.5px;font-weight:600;color:var(--muted);margin-right:3px;align-self:center}
.sescode{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:5px;background:#fff;border:1px solid var(--line);color:var(--navy);cursor:pointer;transition:all .13s}
.sescode:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- Matrix ---------- */
.matrix-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
table.matrix{border-collapse:collapse;width:100%;min-width:720px;font-size:12.5px}
table.matrix th,table.matrix td{padding:0;text-align:center}
table.matrix thead th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:600;font-size:11px;padding:11px 6px;z-index:1}
table.matrix thead th.cyanh{background:#0a7fae}
table.matrix .rowhead{text-align:left;padding:9px 14px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line);background:var(--card);position:sticky;left:0;z-index:1}
table.matrix .rowhead .rc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);margin-right:8px}
table.matrix tbody td{border-bottom:1px solid var(--line)}
table.matrix td.cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line2)}
table.matrix tr:hover .rowhead{background:var(--navy-tint)}
table.matrix tr:hover td{background:var(--navy-tint)}
.mk{display:inline-block;width:9px;height:9px;border-radius:2px}
.mk.c{background:var(--navy)}.mk.a{background:var(--cyan)}
.modrow td{background:var(--paper2);font-family:var(--disp);font-weight:600;text-align:left;padding:8px 14px;font-size:13px;color:var(--navy);position:sticky;left:0}

/* ---------- Compare ---------- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.cmp{grid-template-columns:1fr}}
.cmp-col h3{font-family:var(--disp);font-weight:600;font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.cmp-col .ct{font-size:12.5px;color:var(--faint);font-weight:600;margin-bottom:16px}
.cmp-mod{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--navy)}
.cmp-mod.spr{border-left-color:var(--magenta)}
.cmp-mod .cm-top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.cmp-mod .cm-code{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--navy)}
.cmp-mod.spr .cm-code{color:var(--magenta)}
.cmp-mod h4{font-family:'Public Sans';font-weight:700;font-size:15px;margin:5px 0 8px}
.cmp-mod .cm-lead{font-size:12.5px;color:var(--muted)}
.cmp-mod .cm-stats{display:flex;gap:18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cmp-mod .cm-stats div .n{font-family:var(--disp);font-weight:600;font-size:17px}
.cmp-mod .cm-stats div .l{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:600}

/* ---------- Assessment ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
.panel h3{font-family:var(--disp);font-weight:600;font-size:19px;margin-bottom:4px}
.panel .psub{font-size:12.5px;color:var(--faint);margin-bottom:18px;font-weight:600}
.gbar{display:flex;height:42px;border-radius:10px;overflow:hidden;margin-bottom:16px}
.gseg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-direction:column;gap:0}
.gseg .gp{font-size:10px;font-weight:600;opacity:.85}
.grow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.grow:last-child{border-bottom:none}
.grow .gl{font-weight:500}.grow .gv{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--navy)}
.grow.tot{font-weight:700}.grow.tot .gv{color:var(--magenta)}
.timeline-fb{display:flex;flex-direction:column;gap:12px}
.fb-item{display:flex;gap:13px;align-items:flex-start}
.fb-item .fbn{flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;color:#fff;background:var(--cyan);width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.fb-item .fbn small{font-size:8px;font-weight:600}
.fb-item .fbt{font-size:13.5px;color:var(--ink);padding-top:3px}
.fb-item .fbt b{display:block;font-size:13.5px}
.policy-card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:15px 17px;margin-bottom:11px}
.policy-card .pt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.policy-card .pt .dotg{width:8px;height:8px;border-radius:50%}
.policy-card p{font-size:13px;color:var(--muted);line-height:1.5}
.evaltable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.evaltable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
.evaltable td{padding:11px 10px;border-bottom:1px solid var(--line)}
.evaltable .yr{font-family:'IBM Plex Mono',monospace;font-weight:600}
.evbar{height:7px;border-radius:4px;background:var(--paper2);position:relative;min-width:80px}
.evbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--magenta),var(--cyan))}

/* legend / banner */
.flag-banner{display:flex;gap:14px;align-items:flex-start;background:#fff8ec;border:1px solid #f0d9a8;border-radius:12px;padding:16px 18px;margin-bottom:24px}
.flag-banner .fi{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:#e0961e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.flag-banner .ft{font-size:13.5px;color:#7a5410;line-height:1.55}
.flag-banner .ft b{color:#5a3d08}

.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:680px){.legend-grid{grid-template-columns:1fr}}
.legend-grid .lg-col h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);margin-bottom:13px}
.lg-item{display:flex;gap:11px;align-items:flex-start;margin-bottom:11px;font-size:13.5px}
.lg-item .lk{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;flex-shrink:0;min-width:34px;text-align:center}
.lg-item.c .lk{background:var(--navy);color:#fff}
.lg-item.a .lk{background:var(--cyan);color:#06324a}
.lg-item .ld{color:var(--muted);line-height:1.4}.lg-item .ld b{color:var(--ink);font-weight:600}

/* footer */
.foot{border-top:1px solid var(--line);padding:34px 0 50px;margin-top:40px;color:var(--faint);font-size:13px}
.foot .fr{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.foot a{color:var(--navy);font-weight:600;text-decoration:none}

.btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--navy);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--navy);background:var(--navy-tint)}
.btn.solid{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.solid:hover{background:var(--navy-deep)}

.empty{text-align:center;padding:70px 20px;color:var(--faint)}
.empty .ei{font-size:40px;margin-bottom:14px}
.empty h3{font-family:var(--disp);font-weight:600;font-size:20px;color:var(--ink);margin-bottom:6px}

/* print */
@media print{
  .topbar,.toolbar,.menu-btn,.btn,.modal,.overlay,.hero-grid-bg{display:none !important}
  body{background:#fff}
  .section{padding:18px 0;break-inside:avoid}
  .scard,.clo-block,.panel,.cmp-mod,.ccard{box-shadow:none;break-inside:avoid}
  .hero{background:#fff;color:#000;padding:20px 0;border-bottom:3px solid var(--navy)}
  .hero h1,.hero p.lede,.hstat .n{color:#000}
  .hstat .l{color:#444}
  .sgrid{grid-template-columns:repeat(2,1fr)}
}
/* ---------- Spring sessions, course bands, filters (added) ---------- */

.scard.spring{border-left:3px solid var(--cyan)}
.coursegroup{margin-bottom:14px}
.course-band{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 0 14px;margin:8px 0 18px;border-bottom:2px solid var(--navy)}
.cb-code{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px;letter-spacing:-.01em}
.cb-term{font-size:13px;color:var(--muted);font-weight:600}
.cb-title{font-family:var(--disp);font-size:18px;font-weight:600;color:var(--ink)}
.cb-flag{margin-left:auto;font-size:11.5px;font-weight:600;color:#0676a0;background:var(--cyan-tint);border:1px solid #bfe7f8;border-radius:20px;padding:3px 11px}
.filter-note{font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.flag-banner.ok{background:#f0eaf8;border-color:#d9caec}
.flag-banner.ok .fi{background:#6a3fa0}
.flag-banner.ok .ft{color:#553288}
.flag-banner.ok .ft b{color:#3a2168}
.cm-meta-line{font-size:12px;color:var(--faint);margin-top:6px;font-weight:500}
/* timeline segmented control + spring date */
.seg{display:inline-flex;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;margin-bottom:22px}
.seg button{border:0;background:transparent;font:inherit;font-weight:600;font-size:13px;color:var(--muted);padding:8px 16px;border-radius:7px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:var(--shadow)}
.tldate2{font-size:11.5px;color:var(--faint);font-family:'IBM Plex Mono',monospace;margin-left:auto;padding-right:10px}
/* hero director line */
.hero-dir{display:inline-flex;align-items:center;gap:9px;font-size:14px;color:#dfe0f2;margin-top:4px;margin-bottom:26px}
.hero-dir b{color:#fff;font-weight:700}
.hero-dir .dir-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(6,171,235,.2)}
/* portal launch tiles */
.portal-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 34px;max-width:880px}
.ptile{text-align:left;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:13px;padding:16px 16px 14px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:3px;color:#fff;backdrop-filter:blur(2px)}
.ptile:hover{background:rgba(255,255,255,.13);transform:translateY(-2px);border-color:rgba(255,255,255,.3)}
.pt-ic{font-size:20px;margin-bottom:6px}
.pt-t{font-weight:700;font-size:15px}
.pt-d{font-size:12px;color:#cfd0e6;line-height:1.45}
.pt-go{font-size:12px;font-weight:700;color:var(--cyan);margin-top:7px}
.ptile:hover .pt-go{color:#7fd6f6}
/* leadership grid */
.lead-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.lead-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.lead-card[onclick],.lead-card{cursor:default}
.lead-card.director{border:1px solid var(--cyan);background:linear-gradient(180deg,var(--cyan-tint),var(--card))}
.lc-role{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.lead-card.director .lc-role{color:#0676a0}
.lc-name{font-family:var(--disp);font-size:17px;font-weight:600;margin-top:5px;color:var(--ink)}
.lc-note{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
/* survey panel */
.survey-panel{padding:0;overflow:hidden}
.survey-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 22px;background:var(--navy);color:#fff}
.sv-badge{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--cyan);color:#04303f;padding:5px 12px;border-radius:20px}
.sv-sub{font-size:13px;color:#d7d8ee}
.survey-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.sv-item{padding:18px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sv-item:nth-child(2n){border-right:0}

.sv-v{font-size:13px;color:var(--muted);line-height:1.55}
.sv-flag{font-size:12px;color:var(--faint);padding:13px 22px;background:var(--paper2);font-style:italic}
@media(max-width:760px){.portal-tiles{grid-template-columns:1fr 1fr}.survey-grid{grid-template-columns:1fr}.sv-item{border-right:0}}

.gdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:middle;flex:0 0 auto}
.grow .gl{display:flex;align-items:center}
.draft-note{margin-top:10px;font-size:11.5px;line-height:1.5;color:#8a5a1a;background:#fdf6e9;border:1px solid #f0dcab;border-radius:7px;padding:7px 10px}
.mx-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.matrix .courserow td{background:var(--navy);color:#fff;font-family:var(--disp);font-weight:600;font-size:13.5px;padding:9px 14px;position:sticky;left:0}

/* ================= DARK / CONTROLLED-LUMINOSITY THEME ================= */
html{background:var(--bg)}
body{
  font-family:var(--body); background:var(--bg); color:var(--ink);
  font-weight:400; letter-spacing:-.005em;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1100px 640px at 78% -12%, rgba(0,94,184,.28), transparent 62%),
    radial-gradient(900px 560px at 8% 104%, rgba(0,174,239,.13), transparent 60%);
}
#root{position:relative;z-index:1}
.serif,.brand-txt b{font-family:var(--disp);font-weight:600;letter-spacing:-.02em}
.mono{font-family:var(--mono)}

/* --- chrome --- */
.topbar{background:rgba(5,10,18,.72);backdrop-filter:blur(22px) saturate(140%);border-bottom:1px solid var(--line)}
.nav button{color:var(--muted);font-weight:450;letter-spacing:-.01em}
.nav button:hover{color:var(--ink);background:rgba(98,217,255,.08)}
.nav button.active{background:rgba(0,174,239,.14);color:var(--accent)}
.brand-mark{background:linear-gradient(140deg,var(--cyan),var(--navy));box-shadow:0 0 22px rgba(0,174,239,.35)}
.brand-txt span{color:var(--faint)}
.menu-btn{background:rgba(98,217,255,.10);border:1px solid var(--line);color:var(--ink)}
@media(max-width:920px){.nav{background:rgba(5,10,18,.96);border-bottom:1px solid var(--line)}}
.foot{background:transparent;border-top:1px solid var(--line);color:var(--faint)}
.foot a{color:var(--accent)}

/* --- glass panels --- */
.panel,.scard,.modal,.gl-card,.policy-card,.tile,.mblock .note-box,.posrib,.na,.startcard,.rm-col,.evaltable,.maplink{
  background:linear-gradient(145deg,rgba(15,35,54,.72),rgba(5,10,18,.88));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 60px rgba(0,20,48,.42);
  backdrop-filter:blur(20px);
}
.panel,.modal,.gl-card,.startcard{border-radius:26px}
.scard,.tile,.rm-col,.na,.posrib{border-radius:20px}
.scard,.tile,.na{position:relative;overflow:hidden;transition:transform .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease)}
.scard::before,.tile::before,.na::before{
  content:"";position:absolute;inset:-1px;padding:1px;border-radius:inherit;pointer-events:none;opacity:0;
  background:linear-gradient(120deg,transparent 15%,rgba(98,217,255,.65),transparent 55%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude; transition:opacity .6s var(--ease);
}
.scard:hover::before,.tile:hover::before,.na:hover::before{opacity:1}
.scard:hover,.tile:hover,.na:hover{transform:translateY(-2px);border-color:rgba(98,217,255,.34)}
.na.empty{background:rgba(98,217,255,.04);border-style:dashed;box-shadow:none}

/* --- type + surfaces --- */
h1,h2,h3,h4,.sec-head h2,.panel h3{font-family:var(--disp);font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.kicker,.sc-lab,.na-dir,.pr-ml,.fac-sub{color:var(--faint)}
.sec-head p,.psub,p{color:var(--muted)}
.note-box{background:rgba(98,217,255,.07);color:var(--muted);border:1px solid var(--line)}
.draft-note{background:rgba(98,217,255,.07);color:var(--muted)}
.stype,.pill,.statusb,.rc,.scode,.mcode,.fs-code,.na-code{font-family:var(--mono)}
.pill{background:rgba(98,217,255,.09);border:1px solid var(--line);color:var(--muted)}
.overlay{background:rgba(2,6,12,.72);backdrop-filter:blur(10px)}
.close{background:rgba(98,217,255,.10);border:1px solid var(--line);color:var(--ink)}
.close:hover{background:rgba(98,217,255,.20)}
.fac-search{background:rgba(13,27,44,.7);border:1px solid var(--line);color:var(--ink)}
.fac-search::placeholder{color:var(--faint)}
.fac-row{border-top:1px solid var(--line)}
.fac-name{font-family:var(--disp);color:var(--ink)}
.fs:hover{background:rgba(98,217,255,.08)}
.fs-topic{color:var(--ink)}
.mx-filter button,.btn{background:rgba(98,217,255,.08);border:1px solid var(--line);color:var(--muted)}
.mx-filter button.on,.mx-filter button:hover,.btn:hover{background:rgba(0,174,239,.16);color:var(--accent);border-color:var(--line2)}
.btn.solid{background:var(--cyan);color:#04121D;border-color:transparent;font-weight:600}
.btn.solid:hover{background:var(--accent);color:#04121D}
table,td,th{border-color:var(--line)!important;color:var(--muted)}
th{color:var(--faint)}
.cell{border-color:var(--line)}
.mk.c{background:var(--cyan)} .mk.a{background:var(--accent)}
input,select,textarea{background:rgba(13,27,44,.7);border:1px solid var(--line);color:var(--ink)}

/* --- ribbon --- */
.posrib{background:linear-gradient(145deg,rgba(15,35,54,.60),rgba(5,10,18,.80))}
.pr-tick{opacity:.20}
.pr-tick.done{opacity:.55}
.pr-tick.on{opacity:1;box-shadow:0 0 16px currentColor}
.pr-foot{color:var(--faint)}

/* --- start card --- */
.startcard{background:linear-gradient(145deg,rgba(0,94,184,.28),rgba(5,10,18,.92));color:var(--ink)}
.startcard::after{background:radial-gradient(620px 220px at 88% -30%,rgba(0,174,239,.28),transparent 66%)}
.sc-item{background:rgba(98,217,255,.08);border:1px solid var(--line);color:var(--ink)}
.sc-item:hover{background:rgba(98,217,255,.16);border-color:var(--line2)}
.sc-item span{color:var(--muted)}
.sc-head em{background:linear-gradient(96deg,var(--cyan),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-style:normal}

/* --- motion --- */
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.section,.hero-inner,.wrap.landing{animation:riseIn .7s var(--ease) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.001ms!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}


/* ================= HERO + LANDING (dark direction) ================= */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;
  background:transparent;color:var(--ink);padding:0;overflow:hidden}
.hero::before,.hero::after{display:none}
.hero-art{position:absolute;right:-14%;top:50%;transform:translateY(-50%);
  width:min(78vw,880px);aspect-ratio:1;opacity:.92;pointer-events:none;
  animation:drift 26s ease-in-out infinite alternate}
.hero-art svg{width:100%;height:100%;display:block}
@keyframes drift{from{transform:translateY(calc(-50% - 10px))}to{transform:translateY(calc(-50% + 10px))}}
@media(max-width:900px){.hero-art{right:-32%;top:12%;transform:none;width:130vw;opacity:.45;animation:none}
  .hero{min-height:auto;padding:120px 0 90px}}
.hero-inner{position:relative;z-index:2;max-width:1240px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--accent);opacity:.86;margin-bottom:26px}
.hero-h1{font-family:var(--disp);font-weight:600;font-size:clamp(44px,7vw,88px);line-height:1.0;
  letter-spacing:-.035em;max-width:15ch;margin:0}
.hero-h1 em{font-style:normal;background:linear-gradient(96deg,var(--cyan) 10%,var(--accent) 92%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{margin-top:26px;max-width:600px;font-size:17.5px;line-height:1.62;color:var(--muted);font-weight:400}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:38px}
.cta{font:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;padding:14px 26px;border-radius:999px;
  cursor:pointer;border:1px solid transparent;transition:transform .5s var(--ease),background .5s var(--ease),border-color .5s var(--ease)}
.cta:hover{transform:translateY(-2px)}
.cta.solid{background:var(--cyan);color:#04121D}
.cta.solid:hover{background:var(--accent)}
.cta.ghost{background:rgba(98,217,255,.07);border-color:var(--line);color:var(--ink);backdrop-filter:blur(14px)}
.cta.ghost:hover{background:rgba(98,217,255,.14);border-color:var(--line2)}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:14px 0 6px;border-top:1px solid var(--line)}
@media(max-width:760px){.metrics{grid-template-columns:1fr;gap:22px}}
.metric{padding-top:30px}
.m-n{font-family:var(--disp);font-weight:600;font-size:clamp(40px,5vw,60px);line-height:1;letter-spacing:-.04em;
  background:linear-gradient(150deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.m-l{margin-top:12px;font-size:14px;color:var(--muted);letter-spacing:-.005em}

.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.feat{grid-template-columns:1fr}}
.feat .tile,.next3 .tile{display:block;width:100%;text-align:left;padding:30px 28px 26px;cursor:pointer;font:inherit;color:var(--ink)}
.feat .tile h3{font-size:20px;margin:0 0 10px;letter-spacing:-.02em}
.feat .tile p{font-size:14.5px;line-height:1.6;color:var(--muted);margin:0}
.tile-go{display:inline-block;margin-top:18px;font-size:13px;font-weight:600;color:var(--accent)}
.tile-go::after{content:" \2192";transition:margin .5s var(--ease)}
.tile:hover .tile-go::after{margin-left:5px}

.editorial{font-family:var(--disp);font-weight:600;font-size:clamp(26px,3.6vw,42px);line-height:1.22;
  letter-spacing:-.03em;color:var(--ink);max-width:19ch;margin:0}
.editorial em{font-style:normal;background:linear-gradient(96deg,var(--cyan),var(--accent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.next3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.next3{grid-template-columns:1fr}}
.next3 .tile h3{font-size:17px;margin:8px 0 8px;letter-spacing:-.02em;line-height:1.3}
.next3 .tile p{font-size:13.5px;color:var(--muted);margin:0}
.n3-date{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--accent);text-transform:uppercase}

.cta-band{text-align:center;padding:70px 30px;border-radius:28px;
  background:linear-gradient(150deg,rgba(0,94,184,.24),rgba(5,10,18,.86));border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 80px rgba(0,60,130,.28)}
.cta-band h2{font-size:clamp(26px,3.4vw,38px);letter-spacing:-.03em;margin:0}
.cta-band p{margin:12px auto 26px;max-width:460px;color:var(--muted);font-size:15px}
.section{padding-top:76px;padding-bottom:76px}


/* ================= ALL SESSIONS · filter bar + module bands ================= */
.filterbar,.filterwrap{background:transparent}
.searchbar,.search,.sbar{background:rgba(13,27,44,.72)!important;border:1px solid var(--line)!important;border-radius:14px!important}
.searchbar input,.sbar input,input[type=search]{background:transparent;border:0;color:var(--ink)}
.searchbar input::placeholder,input::placeholder{color:var(--faint);opacity:1}
.count-pill{background:rgba(98,217,255,.08);border:1px solid var(--line);color:var(--muted);border-radius:999px}
.count-pill b{color:var(--accent);font-family:var(--mono)}

.filtergroups{gap:14px 26px;align-items:flex-end}
.fgroup{gap:8px}
.fgroup .flabel{font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--faint)}
.chip{background:rgba(98,217,255,.06);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:7px 14px;font-weight:500;font-size:12.5px;letter-spacing:-.005em;
  transition:background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease)}
.chip:hover{background:rgba(98,217,255,.13);border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
.chip.on,.chip.on.cyan,.chip.on.magenta{background:var(--cyan);border-color:transparent;color:#04121D;font-weight:600}
.chip.on:hover{background:var(--accent);color:#04121D}
.morebtn{font:inherit;font-size:12.5px;font-weight:500;color:var(--accent);background:none;border:0;
  cursor:pointer;padding:7px 2px;align-self:flex-end}
.morebtn:hover{text-decoration:underline}
.clearbtn{color:var(--muted);align-self:flex-end}
.clearbtn:hover{color:var(--accent)}
.filter-note{margin-top:12px;font-size:12px;color:var(--faint)}

/* module band header inside All sessions */
.crs-band,.mod-band,.modhead-bar{background:transparent!important}
.mod-head{margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mod-head h3{font-size:19px;color:var(--ink)}
.mod-head .msub{color:var(--faint);font-weight:400}
.modcode,.mod-head .mcode,.mod-chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  padding:4px 9px;border-radius:6px;color:#04121D}
.crs-title,.course-band,.cband{background:transparent!important;color:var(--ink)!important}

/* session cards in the grid */
.scard{padding:16px 17px}
.scard h4{font-size:14.5px;line-height:1.35;letter-spacing:-.015em;margin:8px 0 6px;color:var(--ink);font-family:var(--body);font-weight:600}
.scard .scode{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--faint)}
.scard .slec{font-size:12.5px;color:var(--muted)}
.scard .sdate{font-size:11.5px;color:var(--faint);margin-top:10px}
.stype{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;background:rgba(98,217,255,.10);color:var(--accent);border:1px solid var(--line)}
.stags{gap:5px;margin-top:9px}
.tag,.ctag,.atag,.pendtag{background:rgba(98,217,255,.07);border:1px solid var(--line);color:var(--muted)}


.course-band{border-bottom:1px solid var(--line);padding:0 0 16px;margin:6px 0 26px}
.cb-code{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.06em;opacity:.85}
.cb-term{font-size:12px;color:var(--faint);font-weight:500}
.cb-title{font-size:22px;letter-spacing:-.02em}
.cb-flag{background:rgba(98,217,255,.08);border:1px solid var(--line);color:var(--muted);font-weight:500}
.modgroup{margin-top:42px}


/* ---------- layout guards ---------- */
html,body{overflow-x:hidden}
.wrap{padding-left:clamp(16px,4vw,28px);padding-right:clamp(16px,4vw,28px);width:100%}
.sgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,258px),1fr));gap:14px}
.sgrid>*,.mod-head>*,.filtergroups>*{min-width:0}

/* ---------- compact filter rows ---------- */
.filtergroups{flex-direction:column;align-items:stretch;gap:12px}
.fgroup{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
.fgroup .flabel{flex:0 0 84px;text-align:right;font-size:11.5px;color:var(--faint)}
@media(max-width:620px){
  .fgroup{align-items:flex-start;gap:8px;flex-direction:column}
  .fgroup .flabel{flex:none;text-align:left}
}
.chip{background:rgba(98,217,255,.09);border-color:rgba(98,217,255,.22);color:#C7D6E4}
.chip:hover{background:rgba(98,217,255,.17);color:#fff}
.morebtn,.clearbtn{align-self:flex-start;padding-left:98px}
@media(max-width:620px){.morebtn,.clearbtn{padding-left:0}}
.searchrow{gap:12px}

/* ---------- module + course headers ---------- */
.mod-head{gap:10px 12px}
.mod-badge{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:5px 10px;border-radius:6px;color:#04121D;letter-spacing:.05em}
.mod-head h3{font-size:17.5px;letter-spacing:-.02em}
.mod-head .msub{font-size:12.5px;font-weight:400;color:var(--faint)}
.mod-line{background:var(--line);opacity:.6}
.course-band{gap:10px}
.cb-code{font-size:11.5px;white-space:nowrap}
.cb-title{font-size:20px}


/* ---------- All sessions toolbar ---------- */
.toolbar{background:rgba(5,10,18,.80)!important;backdrop-filter:blur(22px) saturate(140%);
  border-bottom:1px solid var(--line);padding:18px 0}
.toolbar-inner{gap:16px}
.search,.searchrow .search,.searchrow input{background:rgba(13,27,44,.72);border:1px solid var(--line);
  border-radius:14px;color:var(--ink)}
.searchrow input{border:0;background:transparent}
.search svg,.searchrow svg{color:var(--faint)}


/* ---------- What students learn · framework panel ---------- */
.om-tier{background:linear-gradient(145deg,rgba(15,35,54,.66),rgba(5,10,18,.84));border:1px solid var(--line)}
.om-tier.framework{background:linear-gradient(145deg,rgba(15,35,54,.66),rgba(5,10,18,.84));border-color:var(--line)}
.om-tag{text-transform:none;letter-spacing:-.005em;font-size:12.5px;font-weight:400;color:var(--muted);margin-bottom:14px}
.om-fw{gap:26px}
.om-fw-col,.om-fw-items,.om-fw-item{min-width:0}
.om-fw-h{color:var(--ink);font-size:13px;letter-spacing:-.01em;margin-bottom:10px}
.om-fw-col:nth-child(2) .om-fw-h{color:var(--ink)}
.om-pill{display:flex;align-items:center;gap:8px;width:100%;min-width:0;text-align:left;
  white-space:normal;font-size:12.5px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  cursor:pointer;transition:background .35s var(--ease),border-color .35s var(--ease)}
.om-pill.c,.om-pill.a{background:rgba(98,217,255,.06);color:var(--ink)}
.om-pill.c:hover,.om-pill.a:hover{background:rgba(98,217,255,.14);border-color:var(--line2)}
.om-pill.open{background:rgba(0,174,239,.16);border-color:var(--line2)}
.om-pill b{font-family:var(--mono);font-size:11px;color:var(--accent);margin-right:0;flex:0 0 auto}
.om-caret{margin-left:auto;color:var(--faint);flex:0 0 auto}
.om-desc{font-size:12.5px;line-height:1.6;color:var(--muted);padding:10px 12px 4px}
.om-flow{color:var(--muted);font-size:13px}
.om-flow-n{color:var(--accent);font-family:var(--mono);font-weight:600}
.om-clo,.om-clos>*{min-width:0}
.om-clo-id{font-family:var(--mono);color:var(--accent)}
.om-clo-dom{color:var(--ink)}
.om-clo-txt{color:var(--muted)}


/* ---------- framework pills: force legibility over any earlier light-theme rule ---------- */
.om-tier.framework .om-fw-items .om-pill{
  display:flex;align-items:center;gap:9px;width:100%;min-width:0;
  text-align:left;white-space:normal;line-height:1.4;
  font-size:13px;font-weight:450;padding:11px 13px;border-radius:11px;
  background:rgba(98,217,255,.09)!important;
  border:1px solid rgba(98,217,255,.26)!important;
  color:#F4F8FC!important;
  box-shadow:none;cursor:pointer;
  transition:background .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease);
}
.om-tier.framework .om-fw-items .om-pill:hover{
  background:rgba(98,217,255,.17)!important;border-color:rgba(98,217,255,.46)!important;
  filter:none;transform:translateX(2px);
}
.om-tier.framework .om-fw-items .om-pill.open{
  background:rgba(0,174,239,.22)!important;border-color:rgba(98,217,255,.55)!important;
}
.om-tier.framework .om-fw-col:nth-child(1) .om-pill{border-left:3px solid #005EB8!important}
.om-tier.framework .om-fw-col:nth-child(2) .om-pill{border-left:3px solid #62D9FF!important}
.om-tier.framework .om-pill b{
  font-family:var(--mono);font-size:11.5px;font-weight:600;color:#62D9FF!important;
  flex:0 0 auto;margin:0;letter-spacing:.04em;
}
.om-tier.framework .om-caret{margin-left:auto;flex:0 0 auto;color:#8FA6BC!important;font-size:15px;line-height:1}
.om-tier.framework .om-fw-h{color:#F4F8FC!important;font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:11px}
.om-tier.framework .om-desc{
  color:#C3D2E0!important;font-size:13px;line-height:1.65;
  padding:11px 14px;margin-top:6px;border-left:2px solid rgba(98,217,255,.35);
  background:rgba(98,217,255,.05);border-radius:0 10px 10px 0;
}
.om-tier.framework .om-fw-items{gap:7px}


/* ---------- course-goal cards ---------- */
.om-tier .om-clo{
  background:linear-gradient(150deg,rgba(15,35,54,.62),rgba(5,10,18,.80))!important;
  border:1px solid var(--line)!important;border-radius:14px;padding:16px 16px 14px;gap:7px;
  box-shadow:none!important;
